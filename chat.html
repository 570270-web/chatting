<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Realtime Chat</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;

    display: flex;
    flex-direction: column;

    font-family: Arial, sans-serif;
}

#top {
    height: 55px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 15px;

    border-bottom: 1px solid #ccc;
}

#chat {
    flex: 1;

    overflow-y: auto;

    padding: 15px;
}

.message {
    margin-bottom: 8px;

    word-break: break-word;
}

.name {
    font-weight: bold;
}

#inputArea {
    display: flex;

    padding: 10px;

    border-top: 1px solid #ccc;
}

#message {
    flex: 1;

    padding: 10px;

    font-size: 16px;
}

button {
    padding: 10px 15px;

    cursor: pointer;
}

#send {
    margin-left: 8px;
}

</style>
</head>


<body>


<div id="top">

    <span id="user"></span>

    <button id="logout">
        로그아웃
    </button>

</div>


<div id="chat"></div>


<div id="inputArea">

    <input
        id="message"
        maxlength="2000"
        placeholder="메시지를 입력하세요..."
    >

    <button id="send">
        전송
    </button>

</div>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const supabase =
    createClient(
        "jwtpucjbjmasqqomhyse",
        "sb_publishable_QiqLcG_uOeqsRDQSPv-KMQ_8-fpJFVE"
    );


const chat =
    document.getElementById("chat");

const input =
    document.getElementById("message");

const userLabel =
    document.getElementById("user");


let currentUser = null;
let currentProfile = null;


/* =====================
   로그인 확인
===================== */

const {
    data: {
        user
    }
} =
    await supabase.auth.getUser();


if (!user) {

    location.href =
        "index.html";

}


currentUser = user;


/* =====================
   프로필 가져오기
===================== */

const {
    data: profile,
    error
} =
    await supabase
    .from("profiles")
    .select("username,is_admin")
    .eq("id", user.id)
    .single();


if (error) {

    alert("프로필을 불러오지 못했습니다.");

    await supabase.auth.signOut();

    location.href =
        "index.html";

}


currentProfile = profile;


userLabel.textContent =
    profile.username;


/* =====================
   메시지 출력
===================== */

function addMessage(data) {

    const div =
        document.createElement("div");

    div.className =
        "message";


    const name =
        document.createElement("span");

    name.className =
        "name";

    name.textContent =
        data.username + ": ";


    const text =
        document.createElement("span");

    text.textContent =
        data.content;


    div.appendChild(name);

    div.appendChild(text);

    chat.appendChild(div);

}


/* =====================
   최근 100개
===================== */

const {
    data: messages,
    error: messageError
} =
    await supabase
    .from("messages")
    .select("*")
    .order("created_at", {
        ascending: false
    })
    .limit(100);


if (!messageError) {

    messages
        .reverse()
        .forEach(addMessage);

    chat.scrollTop =
        chat.scrollHeight;

}


/* =====================
   실시간 메시지
===================== */

supabase
.channel("chat-room")

.on(
    "postgres_changes",

    {
        event: "INSERT",

        schema: "public",

        table: "messages"
    },

    payload => {

        addMessage(
            payload.new
        );

        chat.scrollTop =
            chat.scrollHeight;

    }

)

.subscribe();


/* =====================
   메시지 전송
===================== */

async function sendMessage() {

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    const { error } =
        await supabase
        .from("messages")
        .insert({

            user_id:
                currentUser.id,

            username:
                currentProfile.username,

            content:
                text

        });


    if (error) {

        console.error(error);

        alert(
            "메시지를 보내지 못했습니다."
        );

        return;
    }


    input.value = "";

    input.focus();

}


document
.getElementById("send")
.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);


/* =====================
   로그아웃
===================== */

document
.getElementById("logout")
.addEventListener(
    "click",
    async () => {

        await supabase.auth.signOut();

        location.href =
            "index.html";

    }
);

</script>

</body>
</html>
